<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guia interativo de usinagem: furadeira, torno, mandrilhadora e centro de usinagem em 3D, com fórmulas, exemplos resolvidos e simulador de código G.">
<title>Escola de Usinagem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar retrátil (rail de ícones / gaveta no celular) + conteúdo com cabeçalho por módulo. Identidade do portfólio (Calculadora de Peso / Guia Técnico): fundo claro, navy, laranja queimado, IBM Plex, cantos retos. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E4E9EF; --border:#D9DFE7; --border2:#C9D2DD;
  --accent:#B4410E; --accent-hi:#F08A4B; --accent2:#1F6FB2; --accent3:#6B4FBB; --accent4:#1E8A5A; --red:#B42318;
  --text:#26364B; --strong:#0E1B2C; --muted:#4A5A70; --tag-bg:#F2F4F7; --on-accent:#FFFFFF;
  --navy:#0E1B2C; --navy-2:#16263A; --navy-line:#22344B; --navy-text:#D5DEE9; --navy-muted:#8A9AB0; --navy-soft:#C9D4E2;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --sb-w:262px; --sb-rail:64px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.62}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
button,input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent2)}
b,strong{color:var(--strong);font-weight:600}
code,.mono{font-family:var(--f-mono)}
code{font-size:.9em;background:var(--tag-bg);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--strong);white-space:nowrap}

/* ===== SHELL ===== */
.shell{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;width:var(--sb-w);flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:30}
@media (prefers-reduced-motion:no-preference){.sidebar{transition:width .22s ease,transform .22s ease}.nav-item,.sb-toggle svg{transition:all .18s}}
.sb-head{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--border);min-height:64px}
.sb-logo{flex:none;width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px}
.sb-brand{min-width:0;line-height:1.2;white-space:nowrap}
.sb-brand b{display:block;font-size:14px;font-weight:700}
.sb-brand small{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.sb-toggle{margin-left:auto;flex:none;width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--tag-bg);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.sb-toggle:hover{color:var(--accent);border-color:var(--accent)}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 16px;display:grid;align-content:start;gap:2px}
.sb-group{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;text-align:left;white-space:nowrap;position:relative}
.nav-item svg{flex:none;width:19px;height:19px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item[aria-current="page"]{background:rgba(180,65,14,.1);color:var(--accent)}
.nav-item[aria-current="page"]::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-label{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-done{margin-left:auto;flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2)}
.nav-done.on{background:var(--accent4);border-color:var(--accent4);box-shadow:inset 0 0 0 3px var(--surface)}
.sb-foot{border-top:1px solid var(--border);padding:12px 14px;font-size:11px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.sb-prog{height:4px;border-radius:4px;background:var(--tag-bg);margin-top:6px;overflow:hidden}
.sb-prog i{display:block;height:100%;background:var(--accent4);width:0}
.shell.collapsed .sidebar{width:var(--sb-rail)}
.shell.collapsed .sb-brand,.shell.collapsed .nav-label,.shell.collapsed .nav-done,.shell.collapsed .sb-foot{display:none}
.shell.collapsed .sb-head{flex-direction:column;padding:14px 0;gap:10px}
.shell.collapsed .sb-toggle{margin:0}
.shell.collapsed .sb-toggle svg{transform:rotate(180deg)}
.shell.collapsed .sb-group{font-size:0;padding:8px 0 4px;border-top:1px solid var(--border);margin:6px 4px 0}
.shell.collapsed .sb-group:first-child{border-top:0}
.shell.collapsed .nav-item{justify-content:center;padding:9px 0}
.topbar,.scrim{display:none}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(var(--sb-w),84vw);height:100dvh;transform:translateX(-100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);box-shadow:0 0 40px rgba(0,0,0,.5)}
  .shell.collapsed .sidebar{width:min(var(--sb-w),84vw)}
  .shell.collapsed .sb-brand,.shell.collapsed .nav-label,.shell.collapsed .sb-foot{display:block}
  .shell.collapsed .nav-done{display:block}
  .shell.collapsed .sb-head{flex-direction:row;padding:16px 14px}
  .shell.collapsed .sb-group{font-size:10px;padding:14px 10px 6px;border:0;margin:0}
  .shell.collapsed .nav-item{justify-content:flex-start;padding:8px 10px}
  .shell.collapsed .sb-toggle svg{transform:none}
  .shell.drawer-open .sidebar{transform:none}
  .shell.drawer-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,7,12,.6);z-index:25}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar b{font-size:14px}
  .menu-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--tag-bg);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
}

/* ===== PAGE ===== */
.main{flex:1;min-width:0}
header.page{background:var(--navy);border-bottom:4px solid var(--accent-hi);padding-block:32px 24px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.header-label{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
header.page h1{margin:0;font-size:clamp(26px,3.2vw,34px);font-weight:700;color:var(--strong);letter-spacing:-.5px;line-height:1.2;text-wrap:balance}
header.page h1 span{color:var(--accent)}
header.page p{margin:8px 0 0;color:var(--muted);font-size:13.5px;max-width:720px}
.header-meta{margin-top:16px;display:flex;gap:8px 10px;flex-wrap:wrap}
.badge{background:var(--tag-bg);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.badge strong{color:var(--accent)}
.lvl{font-family:var(--f-mono);font-size:10px;font-weight:700;border-radius:4px;padding:2px 7px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.lvl.b{background:rgba(52,211,153,.14);color:var(--accent4);border:1px solid rgba(52,211,153,.3)}
.lvl.i{background:rgba(56,189,248,.14);color:var(--accent2);border:1px solid rgba(56,189,248,.3)}
.lvl.a{background:rgba(167,139,250,.14);color:var(--accent3);border:1px solid rgba(167,139,250,.3)}
.content{padding-block:32px 72px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));max-width:1260px}
@media (max-width:700px){header.page{padding-block:24px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}header.page h1{font-size:24px}.content{padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

h2.st{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:40px 0 16px;display:flex;align-items:center;gap:10px}
h2.st::after{content:'';flex:1;height:1px;background:var(--border)}
h2.st:first-child{margin-top:0}
h3{font-size:16px;color:var(--strong);margin:26px 0 8px;font-weight:700;text-wrap:balance}
h3:first-child{margin-top:0}
p{margin:0 0 12px;max-width:78ch}
.lead{font-size:15.5px;color:var(--text);max-width:74ch}
.muted{color:var(--muted)}
ul.l,ol.l{margin:0 0 14px;padding-left:20px;max-width:78ch}
ul.l li,ol.l li{margin-bottom:5px}
ul.l li::marker{color:var(--accent)}
ol.l li::marker{color:var(--accent);font-family:var(--f-mono);font-weight:700}

.info-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:14px 18px;margin-bottom:18px}
.info-box.blue{border-left-color:var(--accent2)} .info-box.purple{border-left-color:var(--accent3)} .info-box.green{border-left-color:var(--accent4)} .info-box.red{border-left-color:var(--red)}
.info-box h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--strong)}
.info-box p,.info-box li{font-size:13px;color:var(--muted)}
.info-box p:last-child,.info-box ul:last-child{margin-bottom:0}
.info-box ul{margin:0;padding-left:18px}
.info-box li strong,.info-box p strong{color:var(--text)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}
.grid2>.info-box,.grid3>.info-box,.grid2>.card,.grid3>.card{margin:0}
@media (max-width:1000px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;min-width:0}
.card h4{margin:0 0 6px;font-size:14px;color:var(--strong)}
.card p{font-size:13px;color:var(--muted);margin-bottom:8px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:2px 8px;background:var(--tag-bg);border:1px solid var(--border);border-radius:4px;color:var(--muted);font-family:var(--f-mono)}

.table-wrap{overflow-x:auto;margin-bottom:22px;border:1px solid var(--border);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t thead tr{background:var(--surface2);border-bottom:2px solid var(--border)}
table.t th{padding:11px 13px;text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.t tbody tr{border-bottom:1px solid var(--border)}
table.t tbody tr:last-child{border-bottom:0}
table.t tbody tr:hover{background:var(--surface)}
table.t td{padding:10px 13px;vertical-align:top}
table.t td:first-child{color:var(--strong);font-weight:600}
table.t td.m,table.t th.m{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.formula{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:8px;padding:12px 16px;margin:0 0 16px;overflow-x:auto}
.formula .eq{font-family:var(--f-mono);font-size:15px;color:var(--strong);white-space:nowrap}
.formula .eq em{font-style:normal;color:var(--accent)}
.formula .nm{font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:4px;letter-spacing:.02em}
.formula .lg{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px;font-size:12px;color:var(--muted)}
.formula .lg span b{font-family:var(--f-mono);color:var(--text);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
@media (max-width:860px){.fgrid{grid-template-columns:1fr}}

figure.fig{margin:0 0 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;min-width:0}
figure.fig svg{display:block;width:100%;height:auto;max-width:100%}
figure.fig figcaption{font-size:12px;color:var(--muted);margin-top:8px}
.svgtxt{font-family:var(--f-mono);font-size:12px;fill:var(--muted)}

/* subtabs */
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 24px;border-bottom:1px solid var(--border);padding-bottom:0}
.subtabs button{border:0;background:transparent;color:var(--muted);padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button:hover{color:var(--text)}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* buttons */
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{background:#9A370B;border-color:#9A370B;color:var(--on-accent)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(180,65,14,.08)}
.btn svg{width:15px;height:15px}

/* ===== 3D VIEWER ===== */
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:22px}
@media (max-width:1100px){.viewer{grid-template-columns:1fr}}
.vstage{position:relative;min-height:560px;background:radial-gradient(ellipse at 50% 35%,#1e3149 0%,#0B1624 78%);max-width:100%}
@media (max-width:1100px){.vstage{min-height:0;aspect-ratio:16/11}}
@media (max-width:700px){.vstage{aspect-ratio:4/5}.vhud .h:nth-child(3){display:none}}
.vstage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;cursor:grab}
.vstage canvas:active{cursor:grabbing}
.vhud{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none;align-items:flex-start}
.vhud .h{background:rgba(14,27,44,.85);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-family:var(--f-mono);font-size:11px;color:var(--text);backdrop-filter:blur(4px);max-width:100%}
.vhud .h b{color:var(--accent)}
.vhud .h.code{color:var(--accent2)}
.vbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(14,27,44,.88);border:1px solid var(--border);border-radius:10px;padding:7px 9px;backdrop-filter:blur(4px)}
.vbar .sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.vbar label{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.vbar input[type=range]{width:120px;accent-color:var(--accent)}
.vbar .btn{padding:5px 9px;font-size:11.5px}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:center;padding:20px}
.hot{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:rgba(14,27,44,.88);border:1.5px solid var(--accent);color:var(--accent);font:700 10px/17px var(--f-mono);text-align:center;cursor:pointer;user-select:none;padding:0}
.hot.on{background:var(--accent);color:var(--on-accent)}
.hot:hover{transform:translate(-50%,-50%) scale(1.15)}
.vside{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;height:560px;max-height:560px}
@media (max-width:1100px){.vside{border-left:0;border-top:1px solid var(--border);max-height:none;height:auto}}
.vinfo{padding:14px 16px;border-bottom:1px solid var(--border);min-height:150px}
.vinfo .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.vinfo h4{margin:2px 0 6px;font-size:15px;color:var(--strong)}
.vinfo p{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.vinfo .tip{font-size:12px;color:var(--text);background:var(--tag-bg);border:1px solid var(--border);border-radius:6px;padding:6px 9px;margin-top:6px}
.vparts{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1}
@media (max-width:1100px){.vparts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px}}
.vparts button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;text-align:left}
.vparts button:hover{background:var(--surface2);color:var(--text)}
.vparts button[aria-current="true"]{background:rgba(180,65,14,.1);color:var(--accent)}
.vparts .n{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--border2);font:700 10px/18px var(--f-mono);text-align:center}
.vparts button[aria-current="true"] .n{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}

/* ===== CALC ===== */
.calc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start;margin-bottom:22px}
@media (max-width:980px){.calc{grid-template-columns:1fr}}
.cin{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:sticky;top:16px}
@media (max-width:980px){.cin{position:static}}
.cin h4{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.cin .fl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:4px;font-size:11.5px;font-weight:500;color:var(--muted);min-width:0}
.fld.w{grid-column:1/-1}
.inp{display:flex;align-items:center;border:1px solid var(--border);border-radius:7px;background:var(--bg);overflow:hidden}
.inp:focus-within{border-color:var(--accent)}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--strong);font-family:var(--f-mono);font-size:14px;padding:7px 9px;outline:none}
.inp span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);padding-right:9px;white-space:nowrap}
.sel{width:100%;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;padding:8px 9px;outline:none}
.sel:focus{border-color:var(--accent)}
.sel option{background:var(--surface2)}
.steps{display:grid;gap:10px;counter-reset:st;min-width:0}
.step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px 12px 52px;position:relative;min-width:0}
.step::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:7px;background:var(--tag-bg);border:1px solid var(--border2);color:var(--accent);font:700 12px/24px var(--f-mono);text-align:center}
.step h5{margin:0 0 3px;font-size:13.5px;color:var(--strong)}
.step p{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.step .fx{font-family:var(--f-mono);font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;overflow-x:auto;white-space:nowrap}
.step .fx .r{color:var(--accent);font-weight:700}
.step.res{border-color:rgba(180,65,14,.4);background:rgba(180,65,14,.05)}
.step.warn{border-color:rgba(248,113,113,.45)}
.step.warn .fx{border-color:rgba(248,113,113,.35)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-mono);font-size:21px;font-weight:700;color:var(--strong);font-variant-numeric:tabular-nums;line-height:1.35;white-space:nowrap}
.kpi i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:3px}
.kpi.c2{border-left-color:var(--accent2)} .kpi.c3{border-left-color:var(--accent3)} .kpi.c4{border-left-color:var(--accent4)} .kpi.bad{border-left-color:var(--red)} .kpi.bad b{color:var(--red)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.chip.ok{background:rgba(52,211,153,.14);color:var(--accent4)} .chip.wa{background:rgba(180,65,14,.14);color:var(--accent)} .chip.no{background:rgba(248,113,113,.14);color:var(--red)}

/* ISO decoder */
.iso{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.iso button{border:1px solid var(--border);background:var(--bg);color:var(--strong);font:700 22px var(--f-mono);padding:8px 12px;border-radius:7px;cursor:pointer;min-width:44px}
.iso button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(180,65,14,.08)}
.iso button small{display:block;font:500 9px var(--f-mono);color:var(--muted);letter-spacing:.06em;margin-top:2px}

/* quiz */
.quiz{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.q .qh{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.q .qn{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:700}
.q .qt{font-size:14px;color:var(--strong);font-weight:600;margin:0 0 10px;max-width:none}
.q .ops{display:grid;gap:6px}
.q .ops button{text-align:left;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-family:var(--f-body)}
.q .ops button:hover:not(:disabled){border-color:var(--muted)}
.q .ops button.ok{border-color:var(--accent4);background:rgba(52,211,153,.1);color:var(--accent4)}
.q .ops button.no{border-color:var(--red);background:rgba(248,113,113,.08);color:var(--red)}
.q .ops button:disabled{cursor:default}
.q .ex{margin-top:10px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--border);padding-top:10px}
.q .ex strong{color:var(--text)}
.score{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
@media (max-width:900px){.road{grid-template-columns:1fr}}
.road .card{display:flex;flex-direction:column;gap:6px}
.road .mods{display:grid;gap:4px;margin-top:6px}
.road .mods button{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:7px 10px;color:var(--text);cursor:pointer;font-size:12.5px;text-align:left}
.road .mods button:hover{border-color:var(--accent)}
.road .mods .nav-done{margin-left:auto}
.mark-done{margin-top:28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--border)}

/* gcode */
.gsim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;margin-bottom:22px}
@media (max-width:1000px){.gsim{grid-template-columns:1fr}}
.gsim textarea{width:100%;min-height:380px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--strong);font:12.5px/1.6 var(--f-mono);padding:10px 12px;resize:vertical;outline:none}
.gsim textarea:focus{border-color:var(--accent)}
.gcanvas{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:8px;aspect-ratio:4/3;max-width:100%;overflow:hidden}
.gcanvas canvas{width:100%;height:100%;display:block}
.gline{font-family:var(--f-mono);font-size:12px;color:var(--accent2);background:var(--tag-bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin:8px 0;min-height:32px;overflow-x:auto;white-space:nowrap}
.gerr{color:var(--red);font-size:12px;font-family:var(--f-mono)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.gloss .card{padding:12px 14px}
.gloss .card h4{font-size:13.5px;margin:0 0 2px}
.gloss .card .en{font-family:var(--f-mono);font-size:10.5px;color:var(--accent2);margin-bottom:4px}
.gloss .card p{margin:0;font-size:12.5px}
.search{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 13px;color:var(--text);font-size:13px;outline:none;margin-bottom:14px}
.search:focus{border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--strong);font-family:var(--f-mono);padding:8px 14px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ===================== Utilidades ===================== */
const $ = id => document.getElementById(id);
const PI = Math.PI;
const nfCache = {};
function fmt(n, d = 1){
  if(n == null || !isFinite(n)) return '–';
  const k = d; nfCache[k] = nfCache[k] || new Intl.NumberFormat('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
  return nfCache[k].format(n);
}
const nfA = {};
function fmtA(n){ // automático: casas conforme grandeza, sem zeros à direita
  if(n == null || !isFinite(n)) return '–';
  const a = Math.abs(n), d = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : a >= 1 ? 2 : a >= 0.1 ? 3 : 4;
  nfA[d] = nfA[d] || new Intl.NumberFormat('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:d});
  return nfA[d].format(n);
}
function num(v){ if(v === '' || v == null) return NaN; return Number(String(v).trim().replace(',', '.')); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const store = {
  get(k, d){ try{ const v = localStorage.getItem('eu.' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('eu.' + k, JSON.stringify(v)); }catch(e){} }
};
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2000); }

/* ===================== Componentes de conteúdo ===================== */
const H = {
  st: t => `<h2 class="st">${t}</h2>`,
  box: (title, body, c = '') => `<div class="info-box ${c}">${title ? `<h4>${title}</h4>` : ''}${body}</div>`,
  ul: items => `<ul class="l">${items.map(i => `<li>${i}</li>`).join('')}</ul>`,
  ol: items => `<ol class="l">${items.map(i => `<li>${i}</li>`).join('')}</ol>`,
  f: (name, eq, legend = []) => `<div class="formula">${name ? `<div class="nm">${name}</div>` : ''}<div class="eq">${eq}</div>${legend.length ? `<div class="lg">${legend.map(([s, d]) => `<span><b>${s}</b> ${d}</span>`).join('')}</div>` : ''}</div>`,
  table: (head, rows, mono = []) => `<div class="table-wrap"><table class="t"><thead><tr>${head.map((h, i) => `<th class="${mono.includes(i) ? 'm' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${mono.includes(i) ? 'm' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
  card: (title, body, tags = []) => `<div class="card"><h4>${title}</h4>${body}${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}</div>`,
  fig: (svg, cap) => `<figure class="fig">${svg}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`,
  lvl: l => `<span class="lvl ${l}">${{b:'Básico', i:'Intermediário', a:'Avançado'}[l]}</span>`
};

/* ===================== Motor de calculadora passo a passo ===================== */
// spec: {title, inputs:[{k,l,u,v,opts}], run(v) -> {kpis:[{l,v,u,c}], steps:[{t,d,f,r,c}]}}
function mountCalc(el, spec){
  const vals = {}; spec.inputs.forEach(i => vals[i.k] = i.v);
  const ins = spec.inputs.map(i => {
    const id = `c_${spec.id}_${i.k}`;
    if(i.opts) return `<label class="fld ${i.w ? 'w' : ''}" for="${id}">${i.l}<select class="sel" id="${id}" data-k="${i.k}">${i.opts.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(i.v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
    return `<label class="fld ${i.w ? 'w' : ''}" for="${id}">${i.l}<span class="inp"><input id="${id}" data-k="${i.k}" inputmode="decimal" value="${String(i.v).replace('.', ',')}">${i.u ? `<span>${i.u}</span>` : ''}</span></label>`;
  }).join('');
  el.innerHTML = `<div class="calc"><div class="cin"><h4>${spec.title || 'Dados'}</h4><div class="fl">${ins}</div>${spec.note ? `<p class="muted" style="font-size:11.5px;margin:12px 0 0">${spec.note}</p>` : ''}</div><div><div class="kpis"></div><div class="steps"></div></div></div>`;
  const kEl = el.querySelector('.kpis'), sEl = el.querySelector('.steps');
  function run(){
    const v = {};
    spec.inputs.forEach(i => v[i.k] = i.opts ? vals[i.k] : num(vals[i.k]));
    let out;
    try{ out = spec.run(v); }catch(e){ out = {kpis:[], steps:[{t:'Confira os dados', d:'Algum campo está vazio ou inválido.', c:'warn'}]}; }
    kEl.innerHTML = (out.kpis || []).map(k => `<div class="kpi ${k.c || ''}"><small>${k.l}</small><b>${k.v}</b><i>${k.u || ''}</i></div>`).join('');
    sEl.innerHTML = (out.steps || []).map(s => `<div class="step ${s.c || ''}"><h5>${s.t}</h5>${s.d ? `<p>${s.d}</p>` : ''}${s.f ? `<div class="fx">${s.f}${s.r != null ? ` = <span class="r">${s.r}</span>` : ''}</div>` : ''}</div>`).join('');
    if(spec.after) spec.after(el, v, out);
  }
  el.addEventListener('input', e => { const k = e.target.dataset.k; if(k){ vals[k] = e.target.value; run(); } });
  el.addEventListener('change', e => { const k = e.target.dataset.k; if(k){ vals[k] = e.target.value; run(); } });
  run();
}

/* ===================== Dados técnicos de referência ===================== */
// kc1.1 (N/mm²) e mc — valores típicos de tabelas de fabricantes (ordem de grandeza)
const MATS = [
  {id:'a36',  n:'Aço baixo carbono (A36, 1020)', kc:1500, mc:0.25, vc:{tD:[200,280], tA:[250,350], fr:[180,280], bH:[25,30], bM:[80,120], mH:[10,15]}},
  {id:'1045', n:'Aço médio carbono (SAE 1045)',   kc:1600, mc:0.25, vc:{tD:[180,240], tA:[220,300], fr:[160,240], bH:[18,25], bM:[70,100], mH:[8,12]}},
  {id:'4140', n:'Aço ligado beneficiado (4140)',  kc:1950, mc:0.25, vc:{tD:[140,200], tA:[170,240], fr:[120,180], bH:[12,18], bM:[50,80],  mH:[5,8]}},
  {id:'inox', n:'Inox austenítico (304/316)',     kc:2000, mc:0.21, vc:{tD:[140,200], tA:[170,230], fr:[120,180], bH:[10,15], bM:[40,70],  mH:[4,7]}},
  {id:'fofo', n:'Ferro fundido cinzento',          kc:1100, mc:0.28, vc:{tD:[180,280], tA:[220,320], fr:[180,280], bH:[20,30], bM:[70,110], mH:[8,12]}},
  {id:'al',   n:'Alumínio (ligas de usinagem)',    kc:500,  mc:0.25, vc:{tD:[400,1000],tA:[500,1500],fr:[400,1500],bH:[60,100],bM:[150,300],mH:[20,30]}}
];
const matOpts = MATS.map(m => [m.id, m.n]);
const mat = id => MATS.find(m => m.id === id) || MATS[0];
const kcOf = (m, h) => m.kc * Math.pow(Math.max(h, 0.01), -m.mc); // Kienzle

/* ===================== Ícones ===================== */
const ICO = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  move:'<circle cx="12" cy="12" r="8"/><path d="M12 4v4M20 12h-4M12 20v-4M4 12h4"/><circle cx="12" cy="12" r="1.5"/>',
  tool:'<path d="M4 20l7-7"/><path d="M9 11l4 4 7-7-4-4z"/><path d="M14 6l4 4"/>',
  force:'<path d="M3 12h13"/><path d="M12 7l5 5-5 5"/><path d="M20 4v16"/>',
  wear:'<path d="M4 18L12 4l8 14z"/><path d="M8.5 13h7"/><path d="M10 16h4"/>',
  rough:'<path d="M3 15c1.5-4 3-4 4.5 0s3 4 4.5 0 3-4 4.5 0 3 4 4.5 0"/><path d="M3 20h18"/>',
  drill:'<path d="M12 2v4"/><rect x="9" y="6" width="6" height="5" rx="1"/><path d="M12 11v6l-2 3h4l-2-3"/><path d="M10.5 13l3 1.5M10.5 15.5l3 1.5"/>',
  lathe:'<rect x="2" y="15" width="20" height="4" rx="1"/><rect x="3" y="8" width="5" height="7"/><path d="M8 11.5h9"/><rect x="17" y="9" width="4" height="6"/><path d="M12 15v-3"/>',
  boring:'<rect x="2" y="4" width="6" height="16" rx="1"/><path d="M8 11h7"/><circle cx="18" cy="11" r="3.5"/><path d="M2 20h20"/>',
  vmc:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v7"/><path d="M10.5 10h3l-1.5 3z"/><rect x="7" y="15" width="10" height="3"/>',
  power:'<path d="M3 20c3-10 6-14 9-14s4 3 9 3"/><path d="M3 20h18M3 4v16"/>',
  vib:'<path d="M2 12h3l2-6 3 12 3-12 3 12 2-6h4"/>',
  code:'<path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/><path d="M14 5l-4 14"/>',
  clock:'<circle cx="12" cy="13" r="8"/><path d="M12 13V9M9.5 2h5M12 2v3"/>',
  route:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 000-6h-2a3 3 0 010-6h5"/>',

function lineChart({w = 640, h = 300, x0, x1, y0, y1, series = [], points = [], xl = '', yl = '', xt, yt, area = null}){
  const m = {l:56, r:18, t:16, b:42};
  const X = x => m.l + (x - x0) / (x1 - x0) * (w - m.l - m.r);
  const Y = y => h - m.b - (y - y0) / (y1 - y0) * (h - m.t - m.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">`;
  (yt || []).forEach(v => { s += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E4E9EF" stroke-width="1"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" class="svgtxt" style="font-size:11px">${fmtA(v).replace(/,0+$/,'')}</text>`; });
  (xt || []).forEach(v => { s += `<line x1="${X(v)}" x2="${X(v)}" y1="${h - m.b}" y2="${h - m.b + 5}" stroke="#A9B6C6"/><text x="${X(v)}" y="${h - m.b + 18}" text-anchor="middle" class="svgtxt" style="font-size:11px">${fmtA(v).replace(/,0+$/,'')}</text>`; });
  s += `<line x1="${m.l}" x2="${w - m.r}" y1="${h - m.b}" y2="${h - m.b}" stroke="#A9B6C6"/><line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${h - m.b}" stroke="#A9B6C6"/>`;
  if(area){ const pts = area.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' '); s += `<polygon points="${X(area.pts[0][0])},${Y(y0)} ${pts} ${X(area.pts[area.pts.length - 1][0])},${Y(y0)}" fill="${area.c}" fill-opacity=".1"/>`; }
  series.forEach(se => { s += `<polyline points="${se.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')}" fill="none" stroke="${se.c}" stroke-width="${se.w || 2.2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round"/>`; if(se.label){ const p = se.pts[se.lp ?? se.pts.length - 1]; s += `<text x="${X(p[0]) - 4}" y="${Y(p[1]) - 8}" text-anchor="end" style="font:600 11px var(--f-mono);fill:${se.c}">${se.label}</text>`; } });
  points.forEach(p => { s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${p.c}" stroke="#FFFFFF" stroke-width="2"/>${p.label ? `<text x="${X(p.x) + 10}" y="${Y(p.y) - 8}" style="font:700 11px var(--f-mono);fill:${p.c}">${p.label}</text>` : ''}`; });
  s += `<text x="${(m.l + w - m.r) / 2}" y="${h - 6}" text-anchor="middle" class="svgtxt">${xl}</text><text x="14" y="${(m.t + h - m.b) / 2}" text-anchor="middle" class="svgtxt" transform="rotate(-90 14 ${(m.t + h - m.b) / 2})">${yl}</text></svg>`;
  return s;
}
function niceTicks(a, b, n = 5){
  const span = b - a, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag; const out = [];
  for(let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function isoDecoder(){
  const D = {
    shape:{C:'Losango 80°: a mais versátil (desbaste e acabamento)', D:'Losango 55°: perfilar e copiar', S:'Quadrada 90°: desbaste robusto, 4 cantos', T:'Triangular 60°: 3 cantos, uso geral', V:'Losango 35°: perfis complexos, aresta frágil', W:'Trigonal 80°: 3 cantos de 80°, desbaste leve', R:'Redonda: muito forte, desbaste pesado e copiar', K:'Paralelogramo 55°', M:'Losango 86°', E:'Losango 75°'},
    clear:{N:'0°: pastilha negativa, duas faces úteis', B:'5°', C:'7°: positiva, corta leve', P:'11°: positiva, para barras finas', A:'3°', D:'15°', E:'20°'},
    tol:{M:'Prensada (sinterizada), tolerância usual', U:'Prensada, tolerância maior', G:'Retificada, precisão', E:'Retificada, alta precisão', H:'Retificada, alta precisão', C:'Retificada'},
    type:{G:'Furo cilíndrico, quebra-cavaco nas duas faces', M:'Furo cilíndrico, quebra-cavaco em uma face', N:'Sem furo, sem quebra-cavaco', A:'Furo cilíndrico, sem quebra-cavaco', T:'Furo escareado 40°–60°, quebra-cavaco em uma face', W:'Furo escareado 40°–60°, sem quebra-cavaco', R:'Sem furo, quebra-cavaco em uma face'},
    thick:{'01':'1,59 mm','T1':'1,98 mm','02':'2,38 mm','03':'3,18 mm','T3':'3,97 mm','04':'4,76 mm','05':'5,56 mm','06':'6,35 mm','07':'7,94 mm','09':'9,52 mm'},
    rad:{'00':'canto vivo','01':'0,1 mm','02':'0,2 mm','04':'0,4 mm','08':'0,8 mm','12':'1,2 mm','16':'1,6 mm','24':'2,4 mm','M0':'pastilha redonda (métrica)'}
  };
  const names = ['Forma','Folga','Tolerância','Fixação / quebra-cavaco','Tamanho da aresta','Espessura','Raio de ponta','Geometria do fabricante'];
  const inp = $('isoIn'); let sel = 0;
  function parse(s){
    const c = s.toUpperCase().replace(/\s+/g, '');
    const m = c.match(/^([A-Z])([A-Z])([A-Z])([A-Z])(\d{2})(T\d|\d{2})([A-Z]\d|\d{2})(?:-?([A-Z0-9]+))?$/);
    if(!m) return null;
    const sizeTxt = m[1] === 'R' ? `${+m[5]} mm de diâmetro` : `≈ ${+m[5]} mm de comprimento de aresta`;
    return [
      [m[1], D.shape[m[1]] || 'Forma não listada'], [m[2], D.clear[m[2]] || 'Outro ângulo'], [m[3], D.tol[m[3]] || 'Outra classe de tolerância'],
      [m[4], D.type[m[4]] || 'Outro tipo'], [m[5], sizeTxt], [m[6], D.thick[m[6]] || 'Ver tabela do fabricante'],
      [m[7], D.rad[m[7]] || 'Ver tabela do fabricante'], [m[8] || '—', m[8] ? 'Código do fabricante para o quebra-cavaco. Em vários catálogos: F = acabamento, M = médio, R = desbaste; P/M/K indicam o grupo de material.' : 'Sem sufixo de quebra-cavaco']
    ];
  }
  function draw(){
    const r = parse(inp.value);
    if(!r){ $('isoBtns').innerHTML = ''; $('isoOut').innerHTML = '<p class="gerr">Formato esperado: 4 letras + 6 dígitos, como CNMG 120408 ou DCMT 11T304-PF.</p>'; return; }
    $('isoBtns').innerHTML = r.map((p, i) => `<button type="button" data-i="${i}" aria-pressed="${i === sel}">${esc(p[0])}<small>${i + 1}</small></button>`).join('');
    const extra = sel === 6 && r[6][0] !== 'M0' ? `<p class="muted" style="font-size:12.5px">Com f = 0,2 mm/rot este raio dá Ra teórico ≈ ${fmt(1000 * 0.04 / (32 * (parseFloat((D.rad[r[6][0]] || '0.8').replace(',', '.')) || 0.8)), 2)} µm.</p>` : '';
    $('isoOut').innerHTML = `<h4 style="margin:4px 0 4px;font-size:13px;color:var(--accent)">${sel + 1}. ${names[sel]}</h4><p style="margin:0 0 4px">${esc(r[sel][1])}</p>${extra}${H.table(['Pos.','Código','Significado'], r.map((p, i) => [`${i + 1}. ${names[i]}`, `<code>${esc(p[0])}</code>`, esc(p[1])]))}`;
  }
  inp.addEventListener('input', draw);
  $('isoBtns').addEventListener('click', e => { const b = e.target.closest('button'); if(b){ sel = +b.dataset.i; draw(); } });
  draw();
}

    ${H.box('Atalho mental', '<p>Para aço carbono com avanços usuais, kc fica entre <strong>2000 e 2600 N/mm²</strong>. Multiplicando pela taxa de remoção: cada 10 cm³/min de aço removido pede cerca de 0,4 kW de corte.</p>', 'green')}

      {k:'ap', l:'ap', u:'mm', v:3}, {k:'kr', l:'κr', u:'°', v:95}, {k:'D', l:'Ø da peça', u:'mm', v:120}, {k:'eta', l:'Rendimento η', u:'', v:0.8}, {k:'P', l:'Potência da máquina', u:'kW', v:15}

VIEWS.push({id:'desgaste', group:'Fundamentos', label:'Desgaste e vida', icon:'wear', lvl:'i',
  head:{label:'Fundamentos · 4', title:'Desgaste e <span>vida da ferramenta</span>', desc:'Como ler uma aresta gasta, o que causou o desgaste, e a equação de Taylor que explica por que pequenas mudanças de Vc pesam tanto.', meta:[['Nível','intermediário'],['Modelo','Taylor']]},
  render(){ return `
    <p class="lead">A aresta conta o que aconteceu no corte. Saber ler o desgaste é o jeito mais rápido de corrigir parâmetros.</p>
    ${H.st('Tipos de desgaste')}
    <div class="grid3">${WEAR.map(w => `<div class="card"><svg viewBox="0 0 70 70" style="width:64px;height:64px;float:right;margin:0 0 6px 10px"><path d="${w[4]}" fill="#c3ccd6"/><path d="${w[5]}" fill="${C.red || '#B42318'}" stroke="#f87171" stroke-width="1.5"/></svg><h4>${w[0]}</h4><p><strong>Aparência:</strong> ${w[1]}</p><p><strong>Causa:</strong> ${w[2]}</p><p style="margin:0"><strong>Correção:</strong> ${w[3]}</p></div>`).join('')}</div>
    ${H.st('Equação de Taylor')}
    <p>Taylor mediu em 1907 que a vida da ferramenta cai muito mais rápido do que a Vc sobe. A relação é uma lei de potência:</p>
    <div class="fgrid">
      ${H.f('Equação de Taylor', 'Vc · <em>T<sup>n</sup></em> = C', [['T','min, vida da aresta'],['n','expoente da ferramenta'],['C','constante do par ferramenta–material']])}
      ${H.f('Mudando a Vc', 'T₂ = <em>T₁ · (Vc₁ / Vc₂)<sup>1/n</sup></em>', [['n','HSS 0,10 a 0,15'],['','metal duro 0,20 a 0,30'],['','cerâmica 0,40 a 0,60']])}
    </div>
    <div id="calcTaylor"></div>
    ${H.box('Vida econômica (avançado)', '<p>A teoria de Gilbert dá a vida que minimiza o custo por peça: <strong>T = (1/n − 1) · (tft + Cf/Cm)</strong>, onde tft é o tempo de troca da aresta, Cf o custo de uma aresta e Cm o custo do minuto de máquina. Para metal duro (n ≈ 0,25), isso resulta tipicamente em 15 a 45 minutos de vida por aresta. Se as arestas duram horas, a Vc provavelmente está baixa demais; se duram poucos minutos, está alta demais.</p>', 'purple')}
  `; },
  after(){
    mountCalc($('calcTaylor'), {id:'tay', title:'Dados', inputs:[
      {k:'n', l:'Expoente n', u:'', v:0.25}, {k:'T1', l:'Vida medida T₁', u:'min', v:30},
      {k:'V1', l:'Vc₁ (atual)', u:'m/min', v:200}, {k:'V2', l:'Vc₂ (nova)', u:'m/min', v:240}
    ], run(v){
      const T2 = v.T1 * Math.pow(v.V1 / v.V2, 1 / v.n), Cst = v.V1 * Math.pow(v.T1, v.n);
      const prodGain = v.V2 / v.V1;
      return {kpis:[{l:'Nova vida T₂', v:fmt(T2, 1), u:'min'}, {l:'Variação da vida', v:fmt((T2 / v.T1 - 1) * 100, 0), u:'%', c:T2 < v.T1 ? 'bad' : 'c4'}, {l:'Ganho de velocidade', v:fmt((prodGain - 1) * 100, 0), u:'%', c:'c2'}],
      steps:[
        {t:'Constante C do par', f:`C = ${fmtA(v.V1)} · ${fmtA(v.T1)}^${fmtA(v.n)}`, r:fmt(Cst, 0)},
        {t:'Nova vida', f:`T₂ = ${fmtA(v.T1)} · (${fmtA(v.V1)} / ${fmtA(v.V2)})^(1/${fmtA(v.n)})`, r:`${fmt(T2, 1)} min`, c:'res'},
        {t:'Leitura', d:`Mudar a Vc em ${fmt((prodGain - 1) * 100, 0)}% muda a vida em ${fmt((T2 / v.T1 - 1) * 100, 0)}%. ${T2 < v.T1 ? 'Ganhar tempo de corte custa arestas: só compensa se o tempo de corte for o gargalo e a troca de aresta for rápida.' : 'Reduzir Vc preserva a ferramenta, mas cada minuto de máquina também custa.'}`}
      ]};
    }, after(el, v){
      const pts = []; const C0 = v.V1 * Math.pow(v.T1, v.n);
      for(let vc = v.V1 * 0.5; vc <= v.V1 * 1.6; vc += v.V1 * 0.02) pts.push([vc, Math.min(C0 ** (1 / v.n) / vc ** (1 / v.n), 400)]);
      const T2 = C0 ** (1 / v.n) / v.V2 ** (1 / v.n);

function machineView(o){
  return {id:o.id, group:'Máquinas', label:o.label, icon:o.icon, lvl:o.lvl || 'b', head:o.head, tabs:o.tabs,
    render(){
      const t = store.get('tab.' + o.id, o.tabs[0].id);
      const cur = o.tabs.find(x => x.id === t) ? t : o.tabs[0].id;
      return `<div class="subtabs" role="tablist">${o.tabs.map(x => `<button role="tab" data-sub="${x.id}" aria-selected="${x.id === cur}">${x.label}</button>`).join('')}</div><div id="subview"></div>`;
    },
    after(){
      const show = id => {
        const tab = o.tabs.find(x => x.id === id) || o.tabs[0];
        Viewer.unmount();
        document.querySelectorAll('.subtabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.sub === tab.id)));
        $('subview').innerHTML = typeof tab.html === 'function' ? tab.html() : tab.html;
        if(tab.after) tab.after();
        store.set('tab.' + o.id, tab.id);
      };
      document.querySelector('.subtabs').addEventListener('click', e => { const b = e.target.closest('[data-sub]'); if(b) show(b.dataset.sub); });
      show(store.get('tab.' + o.id, o.tabs[0].id));
    }
  };
}

    {id:'ex', label:'Exemplo resolvido', html:`<p>Eixo de SAE 1045 com Ø120 bruto para Ø112 acabado, em 600 mm de comprimento, num torno de 15 kW. Desbaste e acabamento com metal duro.</p><div id="exTor"></div>`, after:() => mountCalc($('exTor'), {id:'tor', inputs:[
      {k:'m', l:'Material', w:1, v:'1045', opts:matOpts}, {k:'Di', l:'Ø bruto', u:'mm', v:120}, {k:'Df', l:'Ø final', u:'mm', v:112}, {k:'L', l:'Comprimento', u:'mm', v:600},
      {k:'ap', l:'ap máx. desbaste', u:'mm', v:3}, {k:'apA', l:'ap acabamento', u:'mm', v:0.6}, {k:'VcD', l:'Vc desbaste', u:'m/min', v:200}, {k:'fD', l:'f desbaste', u:'mm/rot', v:0.35},
      {k:'VcA', l:'Vc acabamento', u:'m/min', v:250}, {k:'fA', l:'f acabamento', u:'mm/rot', v:0.15}, {k:'r', l:'Raio rε', u:'mm', v:0.8}, {k:'nmax', l:'Rotação máx.', u:'rpm', v:1500}, {k:'P', l:'Potência', u:'kW', v:15}
    ], run(v){
      const m = mat(v.m), st = [], la = 5;
      const Dr = v.Df + 2 * v.apA, rad = (v.Di - Dr) / 2, np = Math.max(Math.ceil(rad / v.ap - 1e-9), 0), apr = np ? rad / np : 0;
      st.push({t:'Divisão do sobremetal', d:`Deixar ${fmtA(v.apA)} mm por lado para o acabamento. O desbaste vai de Ø${fmtA(v.Di)} até Ø${fmt(Dr, 1)}.`, f:`np = ⌈ (${fmtA(v.Di)} − ${fmt(Dr, 1)}) / (2 · ${fmtA(v.ap)}) ⌉ → ap real = ${fmt(rad, 2)} / ${np}`, r:`${np} passes de ${fmt(apr, 2)} mm`});
      let D = v.Di, tD = 0, Pmax = 0;
      for(let i = 0; i < np; i++){
        const nC = 1000 * v.VcD / (PI * D), n = Math.min(nC, v.nmax), vf = v.fD * n, t = (v.L + la) / vf;
        const h = v.fD * Math.sin(95 * PI / 180), kc = kcOf(m, h), Vreal = PI * D * n / 1000, Pc = Vreal * apr * v.fD * kc / 60000;

        D -= 2 * apr;
      }
      const nA = Math.min(1000 * v.VcA / (PI * Dr), v.nmax), vfA = v.fA * nA, tA = (v.L + la) / vfA, Ra = 1000 * v.fA ** 2 / (32 * v.r);

      st.push({t:'Rugosidade esperada', f:`Ra ≈ 1000 · ${fmtA(v.fA)}² / (32 · ${fmtA(v.r)})`, r:`${fmt(Ra, 2)} µm (teórico)`});
      const h = v.fD * Math.sin(95 * PI / 180), kc = kcOf(m, h);
      st.push({t:'Potência no 1º passe', d:`kc = ${m.kc}·${fmt(h, 3)}^−${m.mc} = ${fmt(kc, 0)} N/mm². Com rendimento 0,8 o motor precisa de ${fmt(Pmax / 0.8, 1)} kW.`, f:`Pc = Vc · ap · f · kc / 60 000`, r:`${fmt(Pmax, 2)} kW`, c:Pmax / 0.8 > v.P ? 'warn' : ''});
      if(v.apA < v.r * 2 / 3) st.push({t:'Atenção ao ap de acabamento', d:`ap = ${fmtA(v.apA)} mm é menor que 2/3 do raio de ponta (${fmt(v.r * 2 / 3, 2)} mm): a pastilha tende a esfregar e o cavaco não quebra. Aumente o ap ou use raio menor.`, c:'warn'});
      const tot = tD + tA;
      st.push({t:'Tempo de corte total', d:'Sem retornos em rápido, troca de ferramenta, medições e setup.', f:`T = ${fmt(tD, 2)} + ${fmt(tA, 2)}`, r:`${fmt(tot, 2)} min`, c:'res'});
      return {kpis:[{l:'Passes de desbaste', v:String(np), u:''}, {l:'Tempo de corte', v:fmt(tot, 1), u:'min', c:'c2'}, {l:'Potência máx.', v:fmt(Pmax, 1), u:'kW', c:Pmax / 0.8 > v.P ? 'bad' : 'c3'}, {l:'Ra teórico', v:fmt(Ra, 2), u:'µm', c:'c4'}], steps:st};
    }})},
    {id:'pratica', label:'Na prática', html:`
      <div class="grid2">
        ${H.box('Setup', H.ul(['Ferramenta na altura do centro; balanço do suporte no máximo 1,5 vez a altura da haste.', 'Peça longa: contraponto acima de L/D ≈ 3, luneta acima de L/D ≈ 10.', 'Peça bruta de oxicorte ou fundida: centrar pela superfície que será usinada, conferindo o sobremetal em volta toda.', 'Respeite a rotação máxima da placa (gravada no corpo dela).']))}
        ${H.box('Corte', H.ul(['Corte em direção à placa sempre que possível.', 'Primeiro passe abaixo da casca: ap maior que a profundidade da carepa evita o entalhe.', 'Cavaco longo enrolando: aumente f ou troque o quebra-cavaco.', 'Peça vibrando: reduza o balanço, use raio menor, aumente f, reduza ap no acabamento.']), 'blue')}
        ${H.box('Medição', H.ul(['Meça com a peça parada e, nas finais, na temperatura ambiente: aço dilata cerca de 12 µm por metro por °C.', 'Em diâmetros grandes, uma variação de 20 °C muda o Ø300 em cerca de 0,07 mm.', 'Batimento entre diâmetros: tornear tudo sem soltar a peça.']), 'green')}
        ${H.box('Segurança', H.ul(['Nunca deixe a chave na placa.', 'Peças excêntricas: contrabalancear e rodar devagar.', 'Não remova cavaco com a mão nem com a máquina girando.', 'Proteção da placa fechada.']), 'purple')}

/* ---------- Tolerância ISO 286 (µm) ---------- */
const IT_R = [6, 10, 18, 30, 50, 80, 120, 180, 250, 315, 400, 500];
const IT = {6:[8,9,11,13,16,19,22,25,29,32,36,40], 7:[12,15,18,21,25,30,35,40,46,52,57,63], 8:[18,22,27,33,39,46,54,63,72,81,89,97], 9:[30,36,43,52,62,74,87,100,115,130,140,155], 11:[75,90,110,130,160,190,220,250,290,320,360,400]};
function itOf(g, D){ const i = IT_R.findIndex(r => D <= r); return i < 0 ? null : IT[g][i]; }

        ${H.box('Dobrar o Ø da barra', '<p>Flecha <strong>16 vezes menor</strong> (2⁴).</p>', 'green')}

      ${H.box('Regra de ouro da mandrilhadora', '<p>Use o eixo mais rígido para alcançar e o menos rígido só para cortar. Aproxime com Z (coluna ou mesa) ou com o ram, e deixe o quill o mais recolhido possível. Trave os eixos que não estão se movendo.</p>')}`},
    {id:'formulas', label:'Fórmulas', html:`
      <div class="fgrid">
      ${H.f('Rotação no mandrilamento', 'n = <em>1000 · Vc / (π · D)</em>', [['D','Ø do furo após o passe']])}
      ${H.f('Avanço', 'vf = <em>fz · z · n</em>', [['z','1 no acabamento, 2 no twin cutter']])}
      ${H.f('Passes radiais', 'np = <em>⌈ S / ap ⌉</em>', [['S','sobremetal radial, mm']])}
      ${H.f('Tempo por passe', 'tc = <em>(L + 2·a) / vf</em>', [['L','comprimento do furo'],['a','entrada e saída']])}
      ${H.f('Potência', 'Pc = <em>Vc · ap · fz · z · kc</em> / 60 000', [['kc','com h = fz · sen κr']])}
      ${H.f('Força por aresta', 'Fc = <em>kc · ap · fz</em>', [['Fc','N, flexiona a barra']])}
      ${H.f('Cabeçote facejador', 'Vc(r) = <em>2π · r · n</em> / 1000', [['','n fixa: a Vc cai à medida que o carro U vai ao centro']])}
      ${H.f('Tolerância H7', 'furo = <em>D</em> + 0 / + IT7', [['','Ø180–250: IT7 = 46 µm']])}
      </div>`},
    {id:'ex', label:'Exemplo resolvido', html:`<p>Furo de mancal Ø250 H7 numa caixa soldada de aço A36, bruto oxicortado com Ø244, parede de 180 mm. Desbaste com twin cutter e acabamento com cabeçote de mandrilar fino.</p><div id="exMan"></div>`, after:() => mountCalc($('exMan'), {id:'man', inputs:[
      {k:'m', l:'Material', w:1, v:'a36', opts:matOpts}, {k:'Di', l:'Ø bruto', u:'mm', v:244}, {k:'Df', l:'Ø final', u:'mm', v:250}, {k:'L', l:'Comprimento', u:'mm', v:180},
      {k:'VcD', l:'Vc desbaste', u:'m/min', v:150}, {k:'fzD', l:'fz desbaste', u:'mm', v:0.15}, {k:'apD', l:'ap máx. desbaste', u:'mm', v:2.5}, {k:'apA', l:'ap acabamento', u:'mm', v:0.5},
      {k:'VcA', l:'Vc acabamento', u:'m/min', v:180}, {k:'fA', l:'f acabamento', u:'mm/rot', v:0.1}, {k:'d', l:'Ø da barra', u:'mm', v:80}, {k:'Lb', l:'Balanço', u:'mm', v:300},
      {k:'bm', l:'Barra', w:1, v:'aco', opts:[['aco','Aço (E = 210 GPa)'], ['md','Metal duro (E ≈ 600 GPa)']]}
    ], run(v){
      const m = mat(v.m), st = [], a = 5, E = v.bm === 'md' ? 600000 : 210000, lim = v.bm === 'md' ? 6 : 4;
      const S = (v.Df - v.Di) / 2, SD = S - v.apA, np = Math.max(Math.ceil(SD / v.apD - 1e-9), 0), apr = np ? SD / np : 0;
      st.push({t:'Sobremetal', d:`Radial total ${fmt(S, 2)} mm. Reservando ${fmtA(v.apA)} mm para o acabamento, o desbaste remove ${fmt(SD, 2)} mm.`, f:`np = ⌈ ${fmt(SD, 2)} / ${fmtA(v.apD)} ⌉`, r:`${np} passe(s) de ${fmt(apr, 2)} mm`});
      let D = v.Di, tD = 0, PcD = 0, FcD = 0;
      for(let i = 0; i < np; i++){
        D += 2 * apr; const n = 1000 * v.VcD / (PI * D), vf = v.fzD * 2 * n, t = (v.L + 2 * a) / vf;
        const kc = kcOf(m, v.fzD), Pc = v.VcD * apr * v.fzD * 2 * kc / 60000; FcD = kc * apr * v.fzD; PcD = Math.max(PcD, Pc); tD += t;
        st.push({t:`Desbaste ${i + 1} até Ø${fmt(D, 1)} (twin cutter, z = 2)`, f:`n = 1000·${fmtA(v.VcD)}/(π·${fmt(D, 1)}) = ${fmt(n, 0)} rpm · vf = ${fmtA(v.fzD)}·2·${fmt(n, 0)} = ${fmt(vf, 1)} mm/min · t = ${fmt(v.L + 2 * a, 0)}/${fmt(vf, 1)}`, r:`${fmt(t, 2)} min`});
      }
      const nA = 1000 * v.VcA / (PI * v.Df), vfA = v.fA * nA, tA = (v.L + 2 * a) / vfA, kcA = kcOf(m, v.fA), FcA = kcA * v.apA * v.fA;
      st.push({t:'Acabamento até Ø' + fmtA(v.Df) + ' (uma aresta)', f:`n = ${fmt(nA, 0)} rpm · vf = ${fmtA(v.fA)}·${fmt(nA, 0)} = ${fmt(vfA, 1)} mm/min · t = ${fmt(v.L + 2 * a, 0)}/${fmt(vfA, 1)}`, r:`${fmt(tA, 2)} min`});
      st.push({t:'Potência no desbaste', f:`Pc = ${fmtA(v.VcD)} · ${fmt(apr, 2)} · ${fmtA(v.fzD)} · 2 · ${fmt(kcOf(m, v.fzD), 0)} / 60 000`, r:`${fmt(PcD, 2)} kW`});
      const I = PI * v.d ** 4 / 64, dA = FcA * v.Lb ** 3 / (3 * E * I), d1 = FcD * v.Lb ** 3 / (3 * E * I), ratio = v.Lb / v.d;
      st.push({t:'Relação balanço / diâmetro', d:`Limite prático para barra de ${v.bm === 'md' ? 'metal duro' : 'aço'}: ${lim} × Ø.`, f:`L/D = ${fmtA(v.Lb)} / ${fmtA(v.d)}`, r:`${fmt(ratio, 2)} × Ø`, c:ratio > lim ? 'warn' : ''});
      st.push({t:'Flecha da barra no acabamento', d:`Fc = ${fmt(kcA, 0)} · ${fmtA(v.apA)} · ${fmtA(v.fA)} = ${fmt(FcA, 0)} N; I = π·${fmtA(v.d)}⁴/64 = ${fmt(I, 0)} mm⁴.`, f:`δ = ${fmt(FcA, 0)} · ${fmtA(v.Lb)}³ / (3 · ${fmt(E, 0)} · ${fmt(I, 0)})`, r:`${fmt(dA * 1000, 1)} µm`});
      st.push({t:'E se o desbaste fosse com uma aresta só?', d:`Cada aresta do twin cutter faz Fc = ${fmt(FcD, 0)} N. Com duas arestas opostas, as forças se cancelam na barra. Com uma só, a flecha seria:`, f:`δ = ${fmt(FcD, 0)} · ${fmtA(v.Lb)}³ / (3 · E · I)`, r:`${fmt(d1 * 1000, 1)} µm`});
      const it7 = itOf(7, v.Df);
      st.push({t:'Comparar com a tolerância', d:it7 ? `H7 em Ø${fmtA(v.Df)}: 0 a +${it7} µm. A flecha no acabamento deve ficar bem abaixo disso, porque ela varia com o desgaste e com o sobremetal.` : 'Diâmetro fora da tabela.', f:it7 ? `δ / IT7 = ${fmt(dA * 1000, 1)} / ${it7}` : '', r:it7 ? `${fmt(dA * 1000 / it7 * 100, 0)}% da tolerância` : null, c:it7 && dA * 1000 > it7 * 0.3 ? 'warn' : ''});
      const tot = tD + tA;
      st.push({t:'Tempo de corte do furo', f:`T = ${fmt(tD, 2)} + ${fmt(tA, 2)}`, r:`${fmt(tot, 1)} min`, c:'res'});
      return {kpis:[{l:'Tempo de corte', v:fmt(tot, 1), u:'min'}, {l:'Potência desbaste', v:fmt(PcD, 1), u:'kW', c:'c2'}, {l:'Flecha acabamento', v:fmt(dA * 1000, 1), u:'µm', c:it7 && dA * 1000 > it7 * 0.3 ? 'bad' : 'c3'}, {l:'Balanço', v:fmt(ratio, 1), u:'× Ø', c:ratio > lim ? 'bad' : 'c4'}], steps:st};
    }})},
    {id:'pratica', label:'Na prática', html:`
      ${H.box('Peças de caldeiraria pesada', '<p>A maioria das peças que chegam à mandrilhadora numa caldeiraria é soldada. Solda deixa tensões residuais: se a peça for usinada sem alívio, ela "mexe" quando as tensões são liberadas pela remoção de material, e o furo que saiu na medida fica fora no dia seguinte.</p>', 'purple')}
      <div class="grid2">
        ${H.box('Antes de usinar', H.ul(['Confirmar se houve alívio de tensões (tratamento térmico) quando o desenho exigir.', 'Conferir o sobremetal em todo o contorno: a distorção da solda pode deixar um lado sem material para limpar.', 'Traçar as referências e decidir por onde a peça será zerada (as referências A, B, C do desenho).', 'Apoiar a peça em calços sob os pontos de fixação; grampo sobre vão deforma a peça.']))}
        ${H.box('Durante', H.ul(['Nivelar e alinhar com relógio comparador antes de travar.', 'Desbastar tudo, soltar levemente os grampos, deixar a peça acomodar e reapertar antes do acabamento.', 'Furos coaxiais: mandrilar em linha ou girar a mesa 180° sem soltar a peça.', 'Travar os eixos que não se movem; avançar o ram em vez do quill quando o alcance for grande.']), 'blue')}
        ${H.box('Medição', H.ul(['Medir furos H7 com súbito (relógio de diâmetro interno) zerado em anel ou micrômetro.', 'Esperar a peça e o furo esfriarem: furo Ø250 dilata cerca de 30 µm a cada 10 °C.', 'Conferir a coaxialidade de mancais com barra de controle ou relógio no quill.']), 'green')}
        ${H.box('Vibração', H.ul(['Barra vibrando: reduza o balanço, aumente o Ø da barra ou use barra amortecida.', 'Use κr próximo de 90° e raio de ponta pequeno (0,4) no acabamento.', 'Mude a rotação 10% a 20% para sair da faixa de ressonância.', 'Aumentar um pouco o avanço às vezes estabiliza o corte.']), 'red')}
      </div>`}
  ]
}));

  head:{label:'Máquinas · Centro de usinagem', title:'Centro de <span>usinagem vertical</span>', desc:'Fresadora CNC com troca automática de ferramentas: fresa, fura, rosca e mandrila peças prismáticas seguindo um programa.', meta:[['Movimento de corte','ferramenta gira'],['Eixos','X, Y, Z (+ A, B, C)'],['Modelo 3D','VMC rodando programa G']]},
  tabs:[
    {id:'3d', label:'Máquina em 3D', html:() => viewerHTML('centro') + `
      ${H.st('Como o centro de usinagem trabalha')}

      ${H.box('Na animação', '<p>A máquina executa o mesmo programa do módulo CNC e código G: faceamento, contorno, bolsão circular e furação. A linha do programa em execução aparece no canto do visualizador. Repare que a ferramenta só sobe e desce: quem faz o desenho no plano é a mesa.</p>', 'blue')}`,

      ${H.box('Pino de tração', '<p>Os cones 7:24 são puxados para dentro da árvore pelo <strong>pino de tração</strong> (pull stud) roscado no fundo do cone. Cada fabricante de máquina especifica o seu modelo de pino: usar o pino errado pode soltar a ferramenta em rotação.</p>', 'red')}`},
    {id:'ops', label:'Fresamento', html:`
      ${H.fig(SVG_FRESA, 'Vista de cima. No concordante, o dente entra no material com o cavaco mais grosso e sai fino: menos atrito, melhor vida e acabamento. Exige máquina sem folga, o que todo CNC tem.')}

      </div>

      <p>Quando a fresa engaja menos que metade do diâmetro (ae &lt; D/2), o dente não chega a cortar a espessura fz: o cavaco fica mais fino que o avanço por dente. Se fz não for corrigido, a aresta esfrega, aquece e gasta mais rápido, e a máquina trabalha mais devagar do que poderia.</p>
      <div class="fgrid">
        ${H.f('Espessura máxima do cavaco', 'hex = <em>fz · sen κr · √(1 − (1 − 2·ae/D)²)</em>', [['','para ae < D/2; acima disso hex = fz · sen κr']])}
        ${H.f('Espessura média (para o kc)', 'hm = <em>fz · sen κr · (ae/D) · 180 / (π · arcsen(ae/D))</em>', [['arcsen','em graus']])}
        ${H.f('Potência no fresamento', 'Pc = <em>ap · ae · vf · kc</em> / (60 · 10⁶)', [['Pc','kW'],['kc','com h = hm']])}
        ${H.f('Torque', 'M = <em>9549 · Pc / n</em>', [['M','N·m']])}
      </div>
      <div id="calcThin"></div>`, after:() => mountCalc($('calcThin'), {id:'thin', title:'Correção do avanço por dente', inputs:[{k:'D', l:'Ø da fresa', u:'mm', v:16}, {k:'ae', l:'ae', u:'mm', v:2}, {k:'h', l:'hex desejado', u:'mm', v:0.08}, {k:'kr', l:'κr', u:'°', v:90}],
      run(v){ const k = v.ae / v.D, fac = k >= 0.5 ? 1 : Math.sqrt(1 - (1 - 2 * k) ** 2), s = Math.sin(v.kr * PI / 180), fz = v.h / (fac * s);
        return {kpis:[{l:'fz corrigido', v:fmt(fz, 3), u:'mm/dente'}, {l:'Fator', v:fmt(fac * s, 3), u:'', c:'c2'}],
          steps:[{t:'Engajamento radial', f:`ae/D = ${fmtA(v.ae)} / ${fmtA(v.D)}`, r:`${fmt(k * 100, 1)}%`}, {t:'Fator de afinamento', d:k >= 0.5 ? 'Engajamento maior que 50%: o dente passa pela espessura máxima, sem afinamento.' : 'O cavaco é mais fino que fz.', f:k >= 0.5 ? `sen ${fmtA(v.kr)}°` : `sen ${fmtA(v.kr)}° · √(1 − (1 − 2·${fmt(k, 3)})²)`, r:fmt(fac * s, 3)}, {t:'Avanço por dente para obter o hex desejado', f:`fz = ${fmtA(v.h)} / ${fmt(fac * s, 3)}`, r:`${fmt(fz, 3)} mm/dente`, c:'res'}]};
      }})},
    {id:'ex', label:'Exemplo resolvido', html:`<p>Facear uma placa de 300 × 200 mm em aço A36, removendo 3 mm, com cabeçote Ø80, 6 pastilhas, κr 45°, num centro de 15 kW.</p><div id="exCen"></div>`, after:() => mountCalc($('exCen'), {id:'cen', inputs:[
      {k:'m', l:'Material', w:1, v:'a36', opts:matOpts}, {k:'L', l:'Comprimento', u:'mm', v:300}, {k:'B', l:'Largura', u:'mm', v:200}, {k:'S', l:'Sobremetal', u:'mm', v:3},
      {k:'apm', l:'ap máx.', u:'mm', v:1.5}, {k:'D', l:'Ø da fresa', u:'mm', v:80}, {k:'z', l:'Pastilhas z', u:'un', v:6}, {k:'kr', l:'κr', u:'°', v:45},
      {k:'Vc', l:'Vc', u:'m/min', v:220}, {k:'h', l:'hex desejado', u:'mm', v:0.1}, {k:'aeP', l:'ae máx.', u:'% do Ø', v:75}, {k:'P', l:'Potência', u:'kW', v:15}
    ], run(v){
      const m = mat(v.m), st = [], fol = 5;
      const nap = Math.ceil(v.S / v.apm - 1e-9), ap = v.S / nap, nl = Math.ceil(v.B / (v.D * v.aeP / 100) - 1e-9), ae = v.B / nl;
      st.push({t:'Passes em profundidade', f:`⌈ ${fmtA(v.S)} / ${fmtA(v.apm)} ⌉`, r:`${nap} × ap ${fmt(ap, 2)} mm`});
      st.push({t:'Passadas laterais', d:`Com ae máximo de ${fmtA(v.aeP)}% do Ø (${fmt(v.D * v.aeP / 100, 0)} mm), dividir a largura igualmente.`, f:`⌈ ${fmtA(v.B)} / ${fmt(v.D * v.aeP / 100, 0)} ⌉ → ae = ${fmtA(v.B)} / ${nl}`, r:`${nl} passadas de ae ${fmt(ae, 1)} mm`});
      const n = 1000 * v.Vc / (PI * v.D), s = Math.sin(v.kr * PI / 180), k = ae / v.D, fac = k >= 0.5 ? 1 : Math.sqrt(1 - (1 - 2 * k) ** 2), fz = v.h / (s * fac), vf = fz * v.z * n;
      st.push({t:'Rotação', f:`n = 1000 · ${fmtA(v.Vc)} / (π · ${fmtA(v.D)})`, r:`${fmt(n, 0)} rpm`});
      st.push({t:'Avanço por dente', d:`κr = ${fmtA(v.kr)}° afina o cavaco${fac < 1 ? ' e o engajamento menor que 50% também' : ''}; fz precisa ser maior que o hex desejado.`, f:`fz = ${fmtA(v.h)} / (sen ${fmtA(v.kr)}° ${fac < 1 ? '· ' + fmt(fac, 3) : ''})`, r:`${fmt(fz, 3)} mm/dente`});
      st.push({t:'Avanço da mesa', f:`vf = ${fmt(fz, 3)} · ${fmtA(v.z)} · ${fmt(n, 0)}`, r:`${fmt(vf, 0)} mm/min`});
      const hm = fz * s * (ae / v.D) * 180 / (PI * Math.asin(Math.min(ae / v.D, 1)) * 180 / PI), kc = kcOf(m, hm), Pc = ap * ae * vf * kc / 6e7, M = 9549 * Pc / n, Q = ap * ae * vf / 1000;
      st.push({t:'Espessura média e kc', f:`hm = ${fmt(fz, 3)}·sen${fmtA(v.kr)}°·(${fmt(ae, 1)}/${fmtA(v.D)})·180/(π·arcsen(${fmt(ae / v.D, 3)})) = ${fmt(hm, 4)} → kc = ${m.kc}·${fmt(hm, 4)}^−${m.mc}`, r:`${fmt(kc, 0)} N/mm²`});
      st.push({t:'Potência e torque', f:`Pc = ${fmt(ap, 2)} · ${fmt(ae, 1)} · ${fmt(vf, 0)} · ${fmt(kc, 0)} / 60·10⁶ · M = 9549·Pc/n`, r:`${fmt(Pc, 2)} kW · ${fmt(M, 1)} N·m`, c:Pc / 0.8 > v.P ? 'warn' : ''});
      const Lp = v.L + v.D + 2 * fol, tp = Lp / vf, tR = 0.08, tot = nap * nl * (tp + tR);
      st.push({t:'Percurso de cada passada', d:'A fresa entra totalmente fora da peça e sai totalmente do outro lado: comprimento + Ø + duas folgas.', f:`Lp = ${fmtA(v.L)} + ${fmtA(v.D)} + 2·${fol}`, r:`${fmt(Lp, 0)} mm → ${fmt(tp, 2)} min`});
      st.push({t:'Tempo total', d:`${nap * nl} passadas, cada uma com cerca de ${fmt(tR * 60, 0)} s de retorno e reposicionamento em rápido.`, f:`T = ${nap} · ${nl} · (${fmt(tp, 2)} + ${fmtA(tR)})`, r:`${fmt(tot, 2)} min`, c:'res'});
      return {kpis:[{l:'Rotação', v:fmt(n, 0), u:'rpm'}, {l:'Avanço', v:fmt(vf, 0), u:'mm/min', c:'c2'}, {l:'Potência', v:fmt(Pc, 2), u:'kW', c:Pc / 0.8 > v.P ? 'bad' : 'c3'}, {l:'Tempo', v:fmt(tot, 1), u:'min', c:'c4'}, {l:'Remoção Q', v:fmt(Q, 0), u:'cm³/min', c:'c2'}], steps:st};
    }})},
    {id:'pratica', label:'Na prática', html:`
      <div class="grid2">

VIEWS.push({id:'potencia', group:'Avançado', label:'Potência e torque', icon:'power', lvl:'a',
  head:{label:'Avançado · 1', title:'Potência e <span>torque da árvore</span>', desc:'Por que uma máquina de 15 kW pode não ter força para uma fresa grande: abaixo da rotação base, a potência disponível cai junto com a rotação.', meta:[['Nível','avançado']]},
  render(){ return `
    <p class="lead">A placa da máquina diz a potência nominal, mas essa potência só existe numa faixa de rotação. Motores de árvore (principalmente os CNC, com motor de corrente alternada e inversor) têm duas regiões:</p>
    <div class="grid2">
      ${H.box('Abaixo da rotação base: torque constante', '<p>O motor entrega o torque máximo, mas a potência é proporcional à rotação: <strong>P = Pn · n / nb</strong>. A 1/4 da rotação base, a máquina tem 1/4 da potência.</p>', 'blue')}
      ${H.box('Acima da rotação base: potência constante', '<p>A potência fica na nominal e o torque cai: <strong>M = 9549 · Pn / n</strong>. Rotações altas servem para ferramentas pequenas, que pedem pouco torque.</p>', 'purple')}
    </div>
    ${H.box('Consequência prática', '<p>Ferramentas grandes giram devagar (cabeçotes Ø160, barras de mandrilar grandes, machos grandes) e por isso caem na região de torque constante. É ali que a máquina "morre", mesmo pedindo menos que a potência da placa. Máquinas convencionais e mandrilhadoras resolvem isso com <strong>caixa de engrenagens</strong>: a gama baixa multiplica o torque.</p>', 'red')}
    <div id="calcPM"></div>
  `; },
  after(){
    mountCalc($('calcPM'), {id:'pm', title:'Máquina e operação', inputs:[
      {k:'Pn', l:'Potência nominal', u:'kW', v:15}, {k:'nb', l:'Rotação base', u:'rpm', v:1500}, {k:'nmax', l:'Rotação máx.', u:'rpm', v:8000}, {k:'eta', l:'Rendimento η', u:'', v:0.85},
      {k:'n', l:'Rotação da operação', u:'rpm', v:400}, {k:'Pc', l:'Potência de corte', u:'kW', v:6}
    ], note:'Valores típicos: centro vertical 11–22 kW com base 1000–1500 rpm; mandrilhadora CNC 30–40 kW com base 300–600 rpm (por gama).',
    run(v){
      const Pav = v.n < v.nb ? v.Pn * v.n / v.nb : v.Pn, Pm = v.Pc / v.eta, Mreq = 9549 * Pm / v.n, Mmax = 9549 * v.Pn / v.nb, Mav = v.n < v.nb ? Mmax : 9549 * v.Pn / v.n;
      const ok = Pm <= Pav * 0.85, lim = Pm <= Pav;
      return {kpis:[{l:'Disponível nessa rotação', v:fmt(Pav, 1), u:'kW'}, {l:'Exigida no motor', v:fmt(Pm, 1), u:'kW', c:lim ? 'c2' : 'bad'}, {l:'Torque exigido', v:fmt(Mreq, 0), u:'N·m', c:'c3'}, {l:'Torque disponível', v:fmt(Mav, 0), u:'N·m', c:'c4'}],
      steps:[
        {t:'Região de operação', d:v.n < v.nb ? `${fmt(v.n, 0)} rpm está abaixo da rotação base (${fmt(v.nb, 0)}): região de torque constante.` : `${fmt(v.n, 0)} rpm está acima da rotação base: potência constante.`, f:v.n < v.nb ? `P = ${fmtA(v.Pn)} · ${fmt(v.n, 0)} / ${fmt(v.nb, 0)}` : `P = Pn`, r:`${fmt(Pav, 2)} kW`},
        {t:'Potência que o motor precisa entregar', f:`Pm = ${fmtA(v.Pc)} / ${fmtA(v.eta)}`, r:`${fmt(Pm, 2)} kW`},
        {t:'Torque máximo do motor', f:`Mmax = 9549 · ${fmtA(v.Pn)} / ${fmt(v.nb, 0)}`, r:`${fmt(Mmax, 0)} N·m`},
        {t:ok ? 'A operação cabe' : lim ? 'No limite' : 'A operação não cabe nessa rotação', c:ok ? 'res' : 'warn', d:ok ? `Usa ${fmt(Pm / Pav * 100, 0)}% do disponível nessa rotação.` : `Precisa de ${fmt(Pm, 1)} kW e há ${fmt(Pav, 1)} kW disponíveis a ${fmt(v.n, 0)} rpm. Saídas: reduzir ap ou ae, usar ferramenta menor (gira mais rápido), aumentar a Vc se a ferramenta permitir, ou usar uma máquina com caixa de engrenagens.`}
      ]};
    }, after(el, v){
      let f = el.querySelector('.pchart'); if(!f){ f = document.createElement('figure'); f.className = 'fig pchart'; el.querySelector('.steps').after(f); }
      const pts = [[0, 0], [v.nb, v.Pn], [v.nmax, v.Pn]], Pm = v.Pc / v.eta, y1 = Math.max(v.Pn, Pm) * 1.2;
      f.innerHTML = lineChart({x0:0, x1:v.nmax, y0:0, y1, xt:niceTicks(0, v.nmax), yt:niceTicks(0, y1), area:{pts, c:'#B4410E'}, series:[{pts, c:'#B4410E', label:'potência disponível', lp:2}], points:[{x:v.n, y:Pm, c:Pm <= (v.n < v.nb ? v.Pn * v.n / v.nb : v.Pn) ? '#1E8A5A' : '#B42318', label:'operação'}], xl:'rotação (rpm)', yl:'potência (kW)'}) + '<figcaption>Curva típica de motor de árvore com inversor. O ponto da operação precisa ficar dentro da área.</figcaption>';
    }});
  }
});

VIEWS.push({id:'rigidez', group:'Avançado', label:'Rigidez e vibração', icon:'vib', lvl:'a',
  head:{label:'Avançado · 2', title:'Rigidez, balanço e <span>vibração</span>', desc:'A flecha da ferramenta e a trepidação limitam o parâmetro antes da potência em barras longas, quills estendidos e peças esbeltas.', meta:[['Nível','avançado']]},
  render(){ return `
    <p class="lead">O sistema máquina–ferramenta–peça é um conjunto de molas. Toda força de corte deforma alguma coisa. Se a deformação é estática, a medida sai errada; se ela oscila, aparece a trepidação (chatter), com marcas na superfície, ruído agudo e quebra de aresta.</p>
    ${H.st('Flecha de ferramentas em balanço')}
    <div id="calcDef"></div>
    ${H.st('Trepidação (chatter)')}
    <p>A trepidação regenerativa acontece porque cada dente corta a ondulação deixada pelo dente anterior. Se a frequência de passagem dos dentes coincide com uma frequência natural do sistema, a ondulação cresce a cada volta. Por isso o corte pode ser estável a 800 rpm, instável a 900 rpm e estável de novo a 1000 rpm: são os chamados <strong>lobos de estabilidade</strong>.</p>
    <div class="grid2">
      ${H.box('Aumentar a rigidez', H.ul(['Reduzir o balanço (ferramenta, quill, peça).', 'Aumentar o Ø da barra ou usar metal duro.', 'Barra ou porta-ferramenta amortecido.', 'Apoiar a peça: contraponto, luneta, macacos.']), 'green')}
      ${H.box('Reduzir a excitação', H.ul(['Reduzir ap (primeiro) ou ae.', 'Ângulo de posição de 90° e raio de ponta pequeno em barras: menos força radial.', 'Geometria positiva e afiada.', 'Fresas com passo diferencial (dentes desigualmente espaçados).']), 'blue')}
      ${H.box('Sair da ressonância', H.ul(['Variar a rotação 10% a 20% para cima ou para baixo.', 'Aumentar levemente o avanço: cavaco mais grosso amortece.', 'No CNC, variação contínua de rotação (spindle speed variation) quando disponível.']), 'purple')}
      ${H.box('Sinais', H.ul(['Som agudo e constante, diferente do ruído normal de corte.', 'Marcas regulares, em padrão de ondas, na superfície.', 'Lascamento repetido da aresta.', 'Peça ou barra "cantando" mesmo em ap baixo.']), 'red')}
    </div>
  `; },
  after(){
    mountCalc($('calcDef'), {id:'def', inputs:[
      {k:'d', l:'Ø da barra', u:'mm', v:40}, {k:'L', l:'Balanço', u:'mm', v:200}, {k:'bm', l:'Material', w:1, v:'aco', opts:[['aco','Aço (210 GPa)'], ['md','Metal duro (600 GPa)']]},
      {k:'m', l:'Material da peça', w:1, v:'a36', opts:matOpts}, {k:'ap', l:'ap', u:'mm', v:1}, {k:'f', l:'f', u:'mm/rot', v:0.15}
    ], run(v){
      const E = v.bm === 'md' ? 600000 : 210000, I = PI * v.d ** 4 / 64, m = mat(v.m), kc = kcOf(m, v.f), F = kc * v.ap * v.f, dl = F * v.L ** 3 / (3 * E * I), r = v.L / v.d, lim = v.bm === 'md' ? 6 : 4;
      return {kpis:[{l:'Força', v:fmt(F, 0), u:'N'}, {l:'Flecha', v:fmt(dl * 1000, 1), u:'µm', c:'c2'}, {l:'Balanço', v:fmt(r, 1), u:'× Ø', c:r > lim ? 'bad' : 'c4'}],
      steps:[{t:'Força de corte', f:`F = ${fmt(kc, 0)} · ${fmtA(v.ap)} · ${fmtA(v.f)}`, r:`${fmt(F, 0)} N`}, {t:'Momento de inércia', f:`I = π · ${fmtA(v.d)}⁴ / 64`, r:`${fmt(I, 0)} mm⁴`}, {t:'Flecha na ponta', f:`δ = ${fmt(F, 0)} · ${fmtA(v.L)}³ / (3 · ${fmt(E, 0)} · ${fmt(I, 0)})`, r:`${fmt(dl * 1000, 1)} µm`, c:'res'}, {t:r > lim ? 'Balanço acima do recomendado' : 'Balanço dentro do recomendado', d:`Limite prático para esta barra: ${lim} × Ø. ${r > lim ? 'Espere vibração; considere barra maior, de metal duro ou amortecida.' : ''}`, c:r > lim ? 'warn' : ''}]};
    }, after(el, v){
      let f = el.querySelector('.dchart'); if(!f){ f = document.createElement('figure'); f.className = 'fig dchart'; el.querySelector('.steps').after(f); }
      const E = v.bm === 'md' ? 600000 : 210000, I = PI * v.d ** 4 / 64, F = kcOf(mat(v.m), v.f) * v.ap * v.f;
      const xs = [], x1 = Math.max(v.L * 2, v.d * 8); for(let L = 0; L <= x1; L += x1 / 60) xs.push([L, F * L ** 3 / (3 * E * I) * 1000]);
      const y1 = xs[xs.length - 1][1] * 1.05;
      f.innerHTML = lineChart({x0:0, x1, y0:0, y1, xt:niceTicks(0, x1), yt:niceTicks(0, y1), series:[{pts:xs, c:'#1F6FB2'}], points:[{x:v.L, y:F * v.L ** 3 / (3 * E * I) * 1000, c:'#B4410E', label:'atual'}], xl:'balanço L (mm)', yl:'flecha (µm)'}) + '<figcaption>A flecha cresce com o cubo do balanço: a curva dispara depois de certo comprimento.</figcaption>';
    }});
  }
});

VIEWS.push({id:'tempos', group:'Avançado', label:'Tempo de máquina', icon:'clock', lvl:'i',
  head:{label:'Avançado · 4', title:'Tempo de máquina e <span>tempo padrão</span>', desc:'Do tempo de corte calculado ao prazo real: tempos auxiliares, setup, tolerâncias e eficiência. É a ponte entre este guia e a calculadora de usinagem.', meta:[['Nível','intermediário']]},
  render(){ return `
    <p class="lead">O tempo de corte (tc) é só uma parte do tempo de máquina. Em oficina de peças grandes e unitárias, é comum o corte ocupar menos da metade do tempo em que a peça fica na máquina.</p>
    ${H.f('Tempo do lote', 'T = <em>Tsetup + N · (tc + ta) · (1 + FT)</em>', [['tc','tempo de corte por peça'],['ta','tempo auxiliar por peça'],['FT','tolerâncias (pessoais, fadiga, esperas), 10 a 20%'],['N','quantidade de peças']])}
    <div class="grid3">
      ${H.box('tc: corte', H.ul(['Calculado pelas fórmulas: L / vf.', 'Inclui entrada e saída da ferramenta.', 'É o único que muda com Vc e f.']))}
      ${H.box('ta: auxiliar (por peça)', H.ul(['Retornos e aproximações em rápido.', 'Troca de ferramenta e de pastilha.', 'Medições durante o processo.', 'Virar ou reposicionar a peça.', 'Rebarbar, limpar cavaco.']), 'blue')}

  `; },
  after(){
    mountCalc($('calcTp'), {id:'tp', inputs:[
      {k:'tc', l:'Corte por peça', u:'min', v:45}, {k:'ta', l:'Auxiliar por peça', u:'min', v:25}, {k:'su', l:'Setup do lote', u:'h', v:4}, {k:'N', l:'Peças', u:'un', v:6},

});

const Viewer = (() => {
  let R = null, scene = null, camera, controls, raf = 0, cur = null, M = null, clock, ro;
  let playing = true, explode = 0, showHots = true, sel = null, camAnim = null;
  const built = {};
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- materiais ---------- */
  function makeMats(){
    const L = c => new THREE.Color(c).convertSRGBToLinear();
    const S = (c, m = .25, r = .55, o = {}) => { if(o.emissive) o.emissive.convertSRGBToLinear(); return new THREE.MeshStandardMaterial(Object.assign({color:L(c), metalness:m, roughness:r, envMapIntensity:0.8}, o)); };
    return {
      cast:S('#4f5d72', .3, .6), paint:S('#8f9cab', .3, .45), dark:S('#262b35', .3, .6), darker:S('#16191f', .2, .7),
      steel:S('#aeb8c3', .9, .32), chrome:S('#e3e8ee', 1, .14), hss:S('#6f7986', .85, .38), carbide:S('#b5bcc6', .85, .3), gold:S('#d4a62a', .85, .3),
      work:S('#8d99a7', .8, .4), machined:S('#c9d2dc', .95, .18), raw:S('#4a4642', .45, .85), primer:S('#8c4a36', .2, .75),
      red:S('#d23b3b', .2, .5), yellow:S('#e8b10e', .25, .5), screen:S('#0b2533', .1, .4, {emissive:new THREE.Color('#38bdf8'), emissiveIntensity:.55}),
      glass:S('#cfe6f5', .1, .05, {transparent:true, opacity:.07, depthWrite:false, side:THREE.DoubleSide}), chip:S('#d9a441', .8, .35),
      hole:S('#0b0d12', .2, .9), trail:new THREE.LineBasicMaterial({color:L('#F08A4B')})
    };
  }
  /* ---------- geometria ---------- */
  function rbox(w, h, d, b = 0.012){
    const s = new THREE.Shape(), x = w / 2 - b, y = h / 2 - b;
    s.moveTo(-x, -y); s.lineTo(x, -y); s.lineTo(x, y); s.lineTo(-x, y); s.lineTo(-x, -y);
    const g = new THREE.ExtrudeGeometry(s, {depth:Math.max(d - 2 * b, 0.001), bevelEnabled:true, bevelThickness:b, bevelSize:b, bevelSegments:2, curveSegments:4});
    g.translate(0, 0, -(d - 2 * b) / 2); return g;
  }
  function mesh(geo, mat, x = 0, y = 0, z = 0, parent){ const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; if(parent) parent.add(m); return m; }
  const box = (w, h, d, mat, x, y, z, p, b) => mesh(b === 0 ? new THREE.BoxGeometry(w, h, d) : rbox(w, h, d, b ?? Math.min(w, h, d) * 0.06), mat, x, y, z, p);
  function cyl(rt, rb, h, mat, x, y, z, p, axis = 'y', seg = 36){
    const m = mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, p);
    if(axis === 'x') m.rotation.z = -PI / 2; if(axis === 'z') m.rotation.x = PI / 2; return m;
  }
  function twist(w, h, d, turns){
    const g = new THREE.BoxGeometry(w, h, d, 1, 60, 1), a = g.attributes.position;
    for(let i = 0; i < a.count; i++){ const y = a.getY(i), t = (y / h) * turns * 2 * PI, x = a.getX(i), z = a.getZ(i); a.setXYZ(i, x * Math.cos(t) - z * Math.sin(t), y, x * Math.sin(t) + z * Math.cos(t)); }
    g.computeVertexNormals(); return g;
  }
  function drill(r, len, p, y0 = 0, mat){ // broca apontando para -y a partir de y0
    const g = new THREE.Group(); p.add(g); g.position.y = y0;
    mesh(new THREE.CylinderGeometry(r * 0.38, r * 0.38, len, 12), mat, 0, -len / 2, 0, g);
    const f1 = mesh(twist(r * 2, len, r * 0.42, len / (r * 2) / 3.2), mat, 0, -len / 2, 0, g);
    const f2 = mesh(twist(r * 0.42, len, r * 2, len / (r * 2) / 3.2), mat, 0, -len / 2, 0, g);
    const tip = mesh(new THREE.ConeGeometry(r, r * 0.6, 24), mat, 0, -len - r * 0.3, 0, g); tip.rotation.x = PI;
    return g;
  }
  function wheel(r, mat, p, x, y, z, axis = 'z'){
    const g = new THREE.Group(); g.position.set(x, y, z); p.add(g);
    const t = mesh(new THREE.TorusGeometry(r, r * 0.09, 10, 36), mat, 0, 0, 0, g);
    for(let i = 0; i < 3; i++){ const s = mesh(new THREE.CylinderGeometry(r * 0.05, r * 0.05, r, 8), mat, 0, 0, 0, g); s.rotation.z = i * 2 * PI / 3; s.position.set(Math.sin(i * 2 * PI / 3) * -r / 2, Math.cos(i * 2 * PI / 3) * r / 2, 0); }
    mesh(new THREE.CylinderGeometry(r * 0.16, r * 0.16, r * 0.25, 16), mat, 0, 0, 0, g).rotation.x = PI / 2;
    const h = mesh(new THREE.CylinderGeometry(r * 0.07, r * 0.07, r * 0.5, 10), M.dark, r * 0.7, -r * 0.7, r * 0.25, g); h.rotation.x = PI / 2;
    if(axis === 'x') g.rotation.y = PI / 2;
    return g;
  }
  function tslots(p, w, d, y, n, along = 'x', x0 = 0, z0 = 0){
    for(let i = 0; i < n; i++){ const o = (i - (n - 1) / 2) * (along === 'x' ? d : w) / n; if(along === 'x') box(w * 0.96, 0.004, 0.018, M.darker, x0, y, z0 + o, p, 0); else box(0.018, 0.004, d * 0.96, M.darker, x0 + o, y, z0, p, 0); }
  }

  /* ---------- peças (com explosão e animação) ---------- */
  function mkCtx(){ return {root:new THREE.Group(), parts:[]}; }
  function part(ctx, id, name, desc, tip, parent, pos, ex){
    const g = new THREE.Group(); g.position.set(...pos); g.userData = {isPart:true, id}; (parent || ctx.root).add(g);
    const p = {id, name, desc, tip, obj:g, base:g.position.clone(), anim:new THREE.Vector3(), ex:new THREE.Vector3(...ex), anchor:null};
    ctx.parts.push(p); return g;
  }
  function anchors(ctx){
    ctx.root.updateMatrixWorld(true);
    ctx.parts.forEach(p => {
      const bb = new THREE.Box3();
      p.obj.updateMatrixWorld(true);
      const inv = new THREE.Matrix4().copy(p.obj.matrixWorld).invert();
      const walk = o => { o.children.forEach(c => { if(c.userData.isPart) return; if(c.isMesh){ c.geometry.computeBoundingBox(); const b = c.geometry.boundingBox.clone().applyMatrix4(c.matrixWorld).applyMatrix4(inv); bb.union(b); } walk(c); }); };
      walk(p.obj);
      p.anchor = bb.isEmpty() ? new THREE.Vector3() : bb.getCenter(new THREE.Vector3());
    });
  }

  /* ---------- cavacos ---------- */
  function chipPool(scene, n = 70){
