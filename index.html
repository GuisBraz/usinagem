    let k = 0;
    return {
      emit(pos, dir, spread = 0.6, speed = 0.9){ const c = pool[k++ % n]; c.m.position.copy(pos); c.v.set(dir.x + (Math.random() - .5) * spread, dir.y + Math.random() * spread * .6, dir.z + (Math.random() - .5) * spread).normalize().multiplyScalar(speed * (0.6 + Math.random() * 0.6)); c.life = 0.9; c.m.visible = true; },
      step(dt){ pool.forEach(c => { if(c.life <= 0) return; c.life -= dt; c.v.y -= 3.2 * dt; c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += dt * 9; c.m.rotation.y += dt * 7; if(c.life <= 0 || c.m.position.y < 0.01) { c.m.visible = false; c.life = 0; } }); },

  const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

  /* =================================================================== */
  /*                         MODELOS DAS MÁQUINAS                         */
  /* =================================================================== */
  const MODELS = {};

    if(res.stock){ g.fillStyle = 'rgba(167,180,195,.22)'; g.strokeStyle = 'rgba(74,90,112,.55)'; g.fillRect(X(-res.stock.x / 2), Y(res.stock.y / 2), res.stock.x * sc, res.stock.y * sc); g.strokeRect(X(-res.stock.x / 2), Y(res.stock.y / 2), res.stock.x * sc, res.stock.y * sc); }
    g.strokeStyle = '#4A5A70'; g.beginPath(); g.moveTo(X(0) - 12, Y(0)); g.lineTo(X(0) + 12, Y(0)); g.moveTo(X(0), Y(0) - 12); g.lineTo(X(0), Y(0) + 12); g.stroke();
    g.font = '600 18px IBM Plex Mono, monospace'; g.fillStyle = '#4A5A70'; g.fillText('X+', W - 50, Y(0) - 8); g.fillText('Y+', X(0) + 8, 34); g.fillText('G54', X(0) + 8, Y(0) + 22);
    res.moves.forEach((m, i) => {
      if(i > upTo || m.kind === 'tc') return;
      g.beginPath(); g.moveTo(X(m.a.x), Y(m.a.y)); g.lineTo(X(m.b.x), Y(m.b.y));
      if(m.kind === 'rapid'){ g.setLineDash([6, 6]); g.strokeStyle = 'rgba(74,90,112,.55)'; g.lineWidth = 1.5; }
      else { g.setLineDash([]); g.strokeStyle = toolColor(m.tool); g.lineWidth = m.b.z <= 0 ? 3.2 : 1.6; }
      g.stroke(); g.setLineDash([]);
      if(m.kind === 'feed' && Math.abs(m.a.x - m.b.x) < 1e-6 && Math.abs(m.a.y - m.b.y) < 1e-6 && m.b.z < m.a.z){ g.beginPath(); g.arc(X(m.b.x), Y(m.b.y), 6, 0, 2 * PI); g.fillStyle = toolColor(m.tool); g.fill(); }
    });
    if(cur){ g.beginPath(); g.arc(X(cur.x), Y(cur.y), 9, 0, 2 * PI); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#F08A4B'; g.stroke(); }
  }
  function run(){
    cancelAnimationFrame(raf);
    const rap = num($('gRap').value) || 30000;
    res = parseG($('gIn').value, rap);
    store.set('gcode', $('gIn').value);
    $('gErr').innerHTML = res.errors.slice(0, 5).map(esc).join('<br>');
    const s = res.stats;
    const tools = [...new Set(res.moves.filter(m => m.kind === 'tc').map(m => m.tool))];
    $('gStats').innerHTML = `<div class="kpi"><small>Tempo de ciclo</small><b>${fmtTime(s.total)}</b><i>min:s</i></div><div class="kpi c2"><small>Corte</small><b>${fmtTime(s.feed)}</b><i>min:s</i></div><div class="kpi c3"><small>Rápido + trocas</small><b>${fmtTime(s.rapid + s.tc * 5)}</b><i>min:s</i></div><div class="kpi c4"><small>Percurso de corte</small><b>${fmt(s.dist / 1000, 2)}</b><i>m · ${tools.length} ferr.</i></div>`;
    if(!res.moves.length){ draw(); $('gLine').textContent = 'Nenhum movimento encontrado.'; return; }
    const total = res.moves.reduce((a, m) => a + Math.max(m.t, 0.02), 0), dur = 9000, t0 = performance.now();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = now => {
      if(!$('gLine')) return;
      const e = reduce ? dur : now - t0; let acc = 0, idx = res.moves.length - 1, fr = 1;
      const target = Math.min(e / dur, 1) * total;
      for(let i = 0; i < res.moves.length; i++){ const d = Math.max(res.moves[i].t, 0.02); if(acc + d >= target){ idx = i; fr = (target - acc) / d; break; } acc += d; }
      const m = res.moves[idx]; const c = {x:m.a.x + (m.b.x - m.a.x) * fr, y:m.a.y + (m.b.y - m.a.y) * fr, z:m.a.z + (m.b.z - m.a.z) * fr};
      draw(idx, c);
      $('gLine').textContent = `${res.lines[m.line].trim()}   ·   T${m.tool}  Z ${fmt(c.z, 1)}`;
      if(e < dur) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  return {mount(){ $('gIn').value = store.get('gcode', GCODE_DEMO); $('gRun').onclick = run; $('gReset').onclick = () => { $('gIn').value = GCODE_DEMO; run(); }; run(); }};
})();
/* ===================== Navegação e progresso ===================== */
const GROUPS = ['Comece aqui', 'Fundamentos', 'Máquinas', 'Avançado', 'Prática'];
const STUDY = VIEWS.filter(v => !['inicio', 'exercicios', 'tabelas', 'glossario'].includes(v.id)).map(v => v.id);
const ROAD = [
  {l:'b', t:'Básico', d:'O que cada máquina faz e as grandezas que todo cálculo usa.', ids:['movimentos', 'ferramentas', 'furadeira', 'torno']},
  {l:'i', t:'Intermediário', d:'Força, potência, desgaste e tolerância: o que separa um parâmetro possível de um impossível.', ids:['forcas', 'desgaste', 'acabamento', 'mandrilhadora', 'centro', 'tempos']},
  {l:'a', t:'Avançado', d:'Limites reais da máquina, vibração, programação CNC e planejamento de processo.', ids:['potencia', 'rigidez', 'cnc', 'processo']}
];
let done = new Set(store.get('done', []));
let current = null;
const shell = $('shell');
VIEWS[0].head.meta = [['Módulos', String(VIEWS.length)], ['Máquinas em 3D', '4'], ['Calculadoras', '12 + simulador CNC']];

function renderNav(){
  let h = '';
  GROUPS.forEach(g => {
    h += `<div class="sb-group">${g}</div>`;
    VIEWS.filter(v => v.group === g).forEach(v => {
      h += `<button class="nav-item" data-v="${v.id}" title="${esc(v.label)}" ${v.id === current ? 'aria-current="page"' : ''}>${ic(v.icon)}<span class="nav-label">${esc(v.label)}</span>${STUDY.includes(v.id) ? `<span class="nav-done ${done.has(v.id) ? 'on' : ''}" aria-label="${done.has(v.id) ? 'estudado' : 'não estudado'}"></span>` : ''}</button>`;
    });
  });
  $('nav').innerHTML = h;
  const n = STUDY.filter(i => done.has(i)).length;
  $('progTxt').textContent = `${n} de ${STUDY.length} módulos estudados`;
  $('progBar').style.width = (n / STUDY.length * 100) + '%';
}
function renderRoad(){
  const el = $('road'); if(!el) return;
  el.innerHTML = ROAD.map(r => `<div class="card"><div>${H.lvl(r.l)}</div><h4 style="margin-top:4px">${r.t}</h4><p>${r.d}</p><div class="mods">${r.ids.map(id => { const v = VIEWS.find(x => x.id === id); return `<button type="button" data-go="${id}">${ic(v.icon)}<span>${esc(v.label)}</span><span class="nav-done ${done.has(id) ? 'on' : ''}"></span></button>`; }).join('')}</div></div>`).join('');
}
function go(id, push = true){
  const v = VIEWS.find(x => x.id === id) || VIEWS[0];
  Viewer.unmount();
  current = v.id; store.set('view', v.id);
  if(push){ try{ history.replaceState(null, '', '#' + v.id); }catch(e){} }
  $('hLabel').textContent = v.head.label;
  $('hTitle').innerHTML = v.head.title;
  $('hDesc').textContent = v.head.desc;
  $('hMeta').innerHTML = (v.lvl ? H.lvl(v.lvl) : '') + (v.head.meta || []).map(([k, val]) => `<span class="badge">${k} <strong>${val}</strong></span>`).join('');
  $('topTitle').textContent = v.label;
  let html = v.render();
  if(STUDY.includes(v.id)){
    const i = STUDY.indexOf(v.id), nx = VIEWS.find(x => x.id === STUDY[i + 1]);
    html += `<div class="mark-done"><button class="btn ${done.has(v.id) ? '' : 'primary'}" id="mDone" aria-pressed="${done.has(v.id)}">${done.has(v.id) ? 'Estudado ✓' : 'Marcar como estudado'}</button>${nx ? `<button class="btn" data-go="${nx.id}">Próximo: ${esc(nx.label)}</button>` : `<button class="btn" data-go="exercicios">Ir para os exercícios</button>`}</div>`;
  }
  $('view').innerHTML = html;
  if(v.after) v.after();
  const md = $('mDone'); if(md) md.onclick = () => { done.has(v.id) ? done.delete(v.id) : done.add(v.id); store.set('done', [...done]); md.setAttribute('aria-pressed', String(done.has(v.id))); md.className = 'btn ' + (done.has(v.id) ? '' : 'primary'); md.textContent = done.has(v.id) ? 'Estudado ✓' : 'Marcar como estudado'; renderNav(); if(done.has(v.id)) toast('Módulo marcado como estudado'); };
  renderNav();
  shell.classList.remove('drawer-open');
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const n = e.target.closest('[data-v]'); if(n){ go(n.dataset.v); return; }
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); }
});
try{ if(localStorage.getItem('eu.collapsed') === '1') shell.classList.add('collapsed'); }catch(e){}
$('sbToggle').onclick = () => {
  if(matchMedia('(max-width:900px)').matches){ shell.classList.remove('drawer-open'); return; }
  shell.classList.toggle('collapsed');
  try{ localStorage.setItem('eu.collapsed', shell.classList.contains('collapsed') ? '1' : '0'); }catch(e){}
  $('sbToggle').setAttribute('aria-label', shell.classList.contains('collapsed') ? 'Expandir menu' : 'Recolher menu');
};
$('menuBtn').onclick = () => shell.classList.add('drawer-open');
$('scrim').onclick = () => shell.classList.remove('drawer-open');
document.addEventListener('keydown', e => { if(e.key === 'Escape') shell.classList.remove('drawer-open'); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(h && h !== current && VIEWS.some(v => v.id === h)) go(h, false); });

(function init(){
  const h = location.hash.slice(1);
  go(VIEWS.some(v => v.id === h) ? h : store.get('view', 'inicio'), true);
})();
</script>

</body>
